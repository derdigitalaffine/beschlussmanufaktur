name: roadmap-dashboard

on:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, edited, synchronize, closed, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
  schedule:
    - cron: "31 */6 * * *"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: roadmap-dashboard
  cancel-in-progress: true

jobs:
  update-roadmap:
    runs-on: ubuntu-latest
    steps:
      - name: Update product roadmap in issue 41
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const controlIssue = 41;
            const marker = '<!-- roadmap:item:v1 -->';
            const dashboardMarker = '<!-- roadmap-dashboard:v1 -->';
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const qualityGateSequences = new Set([
              'G0',
              'G0,G1',
              'G0,G1,G2',
              'G0,G1,G2,G3',
              'G0,G1,G2,G3,G4',
            ]);

            const trusted = (item) => trustedAssociations.has(item.author_association || 'NONE');
            const isDashboardComment = (comment) => comment?.user?.login === 'github-actions[bot]'
              && String(comment.body || '').trimStart().startsWith(dashboardMarker);

            const ownDashboardEvent = context.eventName === 'issue_comment'
              && context.payload.action !== 'deleted'
              && Number(context.payload.issue?.number) === controlIssue
              && isDashboardComment(context.payload.comment);
            if (ownDashboardEvent) {
              core.info('Ignoring self-generated roadmap dashboard event.');
              return;
            }

            const safeText = (value) => String(value ?? '')
              .replace(/[\r\n]+/g, ' ')
              .replace(/@/g, '@\u200b')
              .replace(/([\\`*_{}\[\]()<>#+.!|])/g, '\\$1');
            const safeCode = (value) => String(value ?? '')
              .replace(/[\r\n]+/g, ' ')
              .replace(/@/g, '@\u200b')
              .replace(/`/g, 'ˋ');

            const fieldValue = (body, fieldName) => {
              const escaped = fieldName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const pattern = new RegExp(`^\\s*(?:-\\s*)?${escaped}\\s*:\\s*(.*)$`, 'i');
              for (const line of String(body || '').split('\n')) {
                const match = line.match(pattern);
                if (match) return match[1].trim();
              }
              return null;
            };

            const normalizeGates = (value) => String(value || '').replace(/\s+/g, '').toUpperCase();
            const parseIsoDate = (value) => {
              const raw = String(value || '');
              if (!/^\d{4}-\d{2}-\d{2}$/.test(raw)) return NaN;
              const timestamp = Date.parse(`${raw}T00:00:00Z`);
              if (Number.isNaN(timestamp)) return NaN;
              return new Date(timestamp).toISOString().slice(0, 10) === raw ? timestamp : NaN;
            };

            const contractChecks = [
              ['valid quality gate chain', qualityGateSequences.has(normalizeGates('G0, G1, G2'))],
              ['skipped quality gate rejected', !qualityGateSequences.has(normalizeGates('G0,G2'))],
              ['reordered quality gate rejected', !qualityGateSequences.has(normalizeGates('G1,G0'))],
              ['real ISO date accepted', !Number.isNaN(parseIsoDate('2026-10-11'))],
              ['impossible ISO date rejected', Number.isNaN(parseIsoDate('2026-02-31'))],
            ];
            for (const [name, ok] of contractChecks) {
              if (!ok) throw new Error(`Roadmap contract failed: ${name}`);
            }

            const valid = {
              stream: new Set(['ux', 'architecture', 'security', 'identity', 'portal', 'operations', 'voting', 'release', 'other']),
              horizon: new Set(['now', 'next', 'later', 'release-gate']),
              priority: new Set(['P0', 'P1', 'P2', 'P3']),
              status: new Set(['discovery', 'ready', 'implementation', 'validation', 'blocked']),
              risk: new Set(['critical', 'high', 'medium', 'low']),
              council: new Set(['yes', 'no']),
            };

            const issuesLike = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const issues = issuesLike.filter((item) => !item.pull_request
              && item.number !== controlIssue
              && trusted(item)
              && String(item.body || '').includes(marker));

            const rows = [];
            const invalid = [];
            const stale = [];
            const now = Date.now();
            const staleAfterMs = 7 * 24 * 60 * 60 * 1000;

            for (const issue of issues) {
              const body = String(issue.body || '');
              const raw = {
                stream: fieldValue(body, 'Stream'),
                outcome: fieldValue(body, 'Outcome'),
                horizon: fieldValue(body, 'Horizon'),
                priority: fieldValue(body, 'Priority'),
                status: fieldValue(body, 'Status'),
                risk: fieldValue(body, 'Risk'),
                gates: fieldValue(body, 'Quality gates'),
                depends: fieldValue(body, 'Depends on'),
                blocks: fieldValue(body, 'Blocks'),
                keys: fieldValue(body, 'Coordination keys'),
                council: fieldValue(body, 'Council required'),
                questions: fieldValue(body, 'Decision questions'),
                evidence: fieldValue(body, 'Evidence'),
                reviewed: fieldValue(body, 'Last reviewed'),
              };

              const normalized = {
                stream: String(raw.stream || '').toLowerCase(),
                horizon: String(raw.horizon || '').toLowerCase(),
                priority: String(raw.priority || '').toUpperCase(),
                status: String(raw.status || '').toLowerCase(),
                risk: String(raw.risk || '').toLowerCase(),
                council: String(raw.council || '').toLowerCase(),
                gates: normalizeGates(raw.gates),
              };

              const requiredPresent = raw.outcome && raw.gates && raw.depends && raw.blocks
                && raw.keys && raw.questions && raw.evidence && raw.reviewed;
              const enumsValid = valid.stream.has(normalized.stream)
                && valid.horizon.has(normalized.horizon)
                && valid.priority.has(normalized.priority)
                && valid.status.has(normalized.status)
                && valid.risk.has(normalized.risk)
                && valid.council.has(normalized.council);
              const gatesValid = qualityGateSequences.has(normalized.gates);
              const reviewedAt = parseIsoDate(raw.reviewed);

              if (!requiredPresent || !enumsValid || !gatesValid || Number.isNaN(reviewedAt)) invalid.push(issue);
              else if (now - reviewedAt > staleAfterMs) stale.push(issue);

              rows.push({ issue, raw, ...normalized, reviewedAt });
            }

            const horizonRank = new Map([['now', 0], ['next', 1], ['later', 2], ['release-gate', 3]]);
            const priorityRank = new Map([['P0', 0], ['P1', 1], ['P2', 2], ['P3', 3]]);
            const riskRank = new Map([['critical', 0], ['high', 1], ['medium', 2], ['low', 3]]);
            rows.sort((a, b) => (horizonRank.get(a.horizon) ?? 9) - (horizonRank.get(b.horizon) ?? 9)
              || (priorityRank.get(a.priority) ?? 9) - (priorityRank.get(b.priority) ?? 9)
              || (riskRank.get(a.risk) ?? 9) - (riskRank.get(b.risk) ?? 9)
              || a.issue.number - b.issue.number);

            const issueLink = (row) => `[#${row.issue.number}](${row.issue.html_url}) ${safeText(row.issue.title)}`;
            const fmt = (value, fallback = '—') => value ? safeText(value) : fallback;
            const code = (value, fallback = '—') => value ? `\`${safeCode(value)}\`` : fallback;

            const lines = [
              dashboardMarker,
              '## 🧭 Dynamische Produktroadmap',
              '',
              `Automatisch aktualisiert: ${new Date().toISOString()} · Zielbild: \`docs/21-produkt-zielbild.md\` · Roadmapvertrag: \`docs/22-dynamische-roadmap.md\``,
              '',
              '> #41 priorisiert Outcomes; #38 koordiniert aktive Claims und Kollisionen. Das Dashboard spiegelt Metadaten und ersetzt keine fachliche Entscheidung.',
            ];

            for (const horizon of ['now', 'next', 'later', 'release-gate']) {
              const title = horizon === 'now' ? 'NOW'
                : horizon === 'next' ? 'NEXT'
                : horizon === 'later' ? 'LATER'
                : 'RELEASE GATE';
              lines.push('', `### ${title}`);
              const list = rows.filter((row) => row.horizon === horizon);
              if (!list.length) {
                lines.push('- Keine offenen Roadmap-Items.');
                continue;
              }
              lines.push('| Issue / Outcome | Stream | Pri / Risiko | Status / Gates | Abhängigkeit | Council / offene Frage | Review |');
              lines.push('| --- | --- | --- | --- | --- | --- | --- |');
              for (const row of list) {
                const outcome = `${issueLink(row)}<br>${fmt(row.raw.outcome)}`;
                const pr = `${code(row.priority)} / ${code(row.risk)}`;
                const sg = `${code(row.status)} / ${code(row.gates)}`;
                const deps = fmt(row.raw.depends);
                const council = `${code(row.council)}<br>${fmt(row.raw.questions)}`;
                const reviewed = code(row.raw.reviewed);
                lines.push(`| ${outcome} | ${code(row.stream)} | ${pr} | ${sg} | ${deps} | ${council} | ${reviewed} |`);
              }
            }

            lines.push('', '### Hauptagent: Aufmerksamkeit');
            const attention = [];
            for (const row of rows) {
              if (row.priority === 'P0') attention.push(`- 🛑 P0: ${issueLink(row)}`);
              else if (row.status === 'blocked') attention.push(`- ⛔ Blockiert: ${issueLink(row)}`);
              else if (row.horizon === 'now' && ['critical', 'high'].includes(row.risk)
                && row.council === 'yes' && !/^(none|keine)$/i.test(String(row.raw.questions || ''))) {
                attention.push(`- 🧠 Council/Entscheidung offen: ${issueLink(row)} — ${fmt(row.raw.questions)}`);
              }
            }
            if (stale.length) attention.push(`- ⏳ >7 Tage nicht geprüft: ${stale.map((issue) => `#${issue.number}`).join(', ')}`);
            if (invalid.length) attention.push(`- ⚠️ Roadmap-Metadaten unvollständig/ungültig: ${invalid.map((issue) => `#${issue.number}`).join(', ')}`);
            lines.push(...(attention.length ? attention : ['- Kein automatisches Aufmerksamkeitssignal.']));

            lines.push('', '### Portfolio-Hygiene');
            lines.push(`- Offene Roadmap-Items: **${rows.length}**`);
            lines.push(`- NOW: **${rows.filter((row) => row.horizon === 'now').length}** · NEXT: **${rows.filter((row) => row.horizon === 'next').length}** · LATER: **${rows.filter((row) => row.horizon === 'later').length}** · RELEASE GATE: **${rows.filter((row) => row.horizon === 'release-gate').length}**`);
            lines.push(`- Ungültige Metadaten: **${invalid.length}** · Review überfällig: **${stale.length}**`);

            const body = `${lines.join('\n')}\n`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: controlIssue, per_page: 100,
            });
            const existing = comments.find(isDashboardComment);
            if (existing) {
              if (String(existing.body || '') !== body) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                core.info('Roadmap dashboard already current.');
              }
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: controlIssue, body });
            }
