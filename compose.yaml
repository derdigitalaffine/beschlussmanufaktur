name: beschlussmanufaktur
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: beschlussmanufaktur
      POSTGRES_USER: beschlussmanufaktur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bitte POSTGRES_PASSWORD setzen}
    volumes: [database:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U beschlussmanufaktur -d beschlussmanufaktur']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: .
    environment: &internal_environment
      SERVER_ROLE: internal
      EXCHANGE_SOURCE: ${EXCHANGE_SOURCE:-}
      EXCHANGE_PROTECTED_KEY: ${EXCHANGE_PROTECTED_KEY:-}
      EXCHANGE_PUBLIC_KEY: ${EXCHANGE_PUBLIC_KEY:-}
      EXCHANGE_PROTECTED_URL: ${EXCHANGE_PROTECTED_URL:-}
      EXCHANGE_PUBLIC_URL: ${EXCHANGE_PUBLIC_URL:-}
      EXCHANGE_CA_FILE: ${EXCHANGE_CA_FILE:-}
      TRUST_PROXY_HEADERS: 'true'
      APPLICATION_URL: ${APPLICATION_URL:-https://localhost}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Bitte DJANGO_SECRET_KEY setzen}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://localhost}
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bitte POSTGRES_PASSWORD setzen}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
    volumes: [files:/app/data]
    networks: [data, edge]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/')"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  exchange-worker:
    build: .
    command: [python, manage.py, exchange_worker, --watch]
    environment: *internal_environment
    volumes: [files:/app/data]
    networks: [data, edge]
    depends_on:
      db: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  notification-worker:
    build: .
    command: [python, manage.py, notification_worker, --watch]
    environment: *internal_environment
    networks: [data, edge]
    depends_on:
      db: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports: ['${HTTP_PORT:-80}:80', '${HTTPS_PORT:-443}:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend/static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [backend]
    restart: unless-stopped
networks:
  data: {internal: true}
  edge:
volumes:
  database:
  files:
  caddy_data:
  caddy_config:
