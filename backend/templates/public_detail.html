{% extends 'base.html' %}{% block content %}<a href="/">← Bürgerinformation</a><article class="card"><h1>{{ record.title }}</h1><div class="markdown">{{ body|safe }}</div>{% if record.kind == 'template' %}<p><a href="{% url 'replica_export' record.pk 'pdf' %}">PDF</a> · <a href="{% url 'replica_export' record.pk 'docx' %}">DOCX</a></p>{% endif %}{% for a in record.attachments %}<p><a href="{% url 'replica_asset' record.pk a.id %}">{{ a.name }}</a></p>{% endfor %}</article>{% endblock %}
